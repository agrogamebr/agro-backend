# ===========================================
# PROFILE: HOMOLOGAÇÃO
# ===========================================
spring:
  application:
    name: agrogame-api

  datasource:
    url: jdbc:postgresql://${DB_HOST_HML:localhost}:${DB_PORT_HML:5432}/${DB_NAME_HML}
    username: ${DB_USERNAME_HML}
    password: ${DB_PASSWORD_HML}
    driver-class-name: org.postgresql.Driver


  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  cloud:
    gcp:
      credentials:
        location: file:${GCP_CREDENTIALS_FILE_PATH}
      project-id: agrogame-qa-project-id

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    tomcat:
      remoteip:
        remote-ip-header: X-Forwarded-For
        protocol-header: X-Forwarded-Proto
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

logging:
  level:
    root: INFO
    br.com.agrogame.agrogame: DEBUG
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  swagger:
    server-url: https://agrogame-api-dev-1017408486443.us-central1.run.app
    server-description: Homologação

  pagination:
    default-page-size: 20
    max-page-size: 100

  points:
    max-transaction-per-day: 50

gcp:
  storage:
    bucket-name: agrogame-uploads-dev
