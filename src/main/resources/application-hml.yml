# ===========================================
# PROFILE: HOMOLOGATION
# ===========================================
spring:
  application:
    name: agrogame-api

  # ===========================================
  # DATABASE CONFIGURATION - PostgreSQL via Cloud SQL
  # ===========================================
  datasource:
    url: jdbc:postgresql:///agrogame_db?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
    open-in-view: false

  # ===========================================
  # FILE UPLOAD CONFIGURATION
  # ===========================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # ===========================================
  # SPRING CLOUD GCP
  # ===========================================
  cloud:
    gcp:
      project-id: agrogame # id real do projeto GCP

# ===========================================
# SERVER CONFIGURATION
# ===========================================
server:
  port: ${PORT:8080}
  compression:
    enabled: true
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# ===========================================
# LOGGING CONFIGURATION
# ===========================================
logging:
  level:
    root: INFO
    br.com.agrogame.agrogame: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# ===========================================
# JWT CONFIGURATION
# ===========================================
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 horas

# ===========================================
# ACTUATOR CONFIGURATION
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ===========================================
# APPLICATION CUSTOM PROPERTIES
# ===========================================
app:
  swagger:
    server-url: https://hml-api.agribit.com.br
    server-description: Homologation/Stagging

  pagination:
    default-page-size: 20
    max-page-size: 100

  points:
    max-transaction-per-day: 50

# ===========================================
# GCP STORAGE (BUCKET)
# ===========================================
gcp:
  storage:
    bucket-name: agrogame-uploads-dev # bucket de dev
