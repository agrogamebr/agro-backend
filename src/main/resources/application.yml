# ===========================================
# SPRING BOOT APPLICATION CONFIGURATION
# ===========================================

spring:
  application:
    name: agrogame-api

  # ===========================================
  # DATABASE CONFIGURATION - PostgreSQL via Cloud SQL Proxy
  # ===========================================
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:agrogame-db-useradmin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver


  # Connection Pool (HikariCP)
  hikari:
    maximum-pool-size: 10
    minimum-idle: 5
    connection-timeout: 30000
    idle-timeout: 300000
    max-lifetime: 1200000

  # ===========================================
  # JPA / HIBERNATE CONFIGURATION
  # ===========================================
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none  # create | update | validate | none
    show-sql: true      # Mostra SQL no console
    properties:
      hibernate:
        format_sql: true              # Formata SQL no console
        use_sql_comments: true        # Adiciona comentarios no SQL
        jdbc:
          batch_size: 20              # Batch para inserts/updates
        order_inserts: true           # Otimiza ordem dos inserts
        order_updates: true           # Otimiza ordem dos updates
        default_schema: public        # Schema padrao
    open-in-view: false               # Desabilita OSIV para melhor performance

  # ===========================================
  # FILE UPLOAD CONFIGURATION
  # ===========================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

# ===========================================
# SERVER CONFIGURATION
# ===========================================
server:
  port: 8080
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# ===========================================
# LOGGING CONFIGURATION
# ===========================================
logging:
  level:
    root: INFO
    br.com.agrogame.agrogame: DEBUG  # Seu pacote correto
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: INFO
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ===========================================
# APPLICATION CUSTOM PROPERTIES
# ===========================================
app:
  storage:
    base-path: /var/uploads
    cdn-url: http://localhost:8080/files

  pagination:
    default-page-size: 20
    max-page-size: 100

  points:
    max-transaction-per-day: 50

# ===========================================
# JWT CONFIGURATION
# ===========================================
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 horas em milissegundos

---
# ===========================================
# PROFILE: DEVELOPMENT
# ===========================================
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: DEBUG
    br.com.agrogame.agrogame: DEBUG

---
# ===========================================
# PROFILE: PRODUCTION
# ===========================================
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: WARN
    br.com.agrogame.agrogame: INFO
    org.hibernate.SQL: WARN

# JWT em produção deve usar variável de ambiente
jwt:
  secret: ${JWT_SECRET}  # OBRIGATÓRIO definir em variável de ambiente


springdoc:
  api-docs:
    path: /v3/api-docs  # Endpoint JSON da documentação
  swagger-ui:
    path: /swagger-ui.html  # Página do Swagger UI
    operationsSorter: method  # Ordena por método HTTP
    tagsSorter: alpha  # Ordena tags alfabeticamente
    tryItOutEnabled: true  # Habilita botão "Try it out"
