# ===========================================
# PROFILE: LOCAL (Eclipse) usando banco DEV/QA
# ===========================================
spring:
  application:
    name: agrogame-api-local

  datasource:
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 0 

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  cloud:
    gcp:
      project-id: agrogame
      sql:
        database-name: ${DB_NAME}
        instance-connection-name: agrogame:us-central1:agrogame-db-qa
      pubsub:
        enabled: true