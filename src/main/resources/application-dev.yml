# ===========================================
# PROFILE: DEVELOPMENT
# ===========================================
spring:
  application:
    name: agrogame-api

  # ===========================================
  # DATABASE CONFIGURATION - PostgreSQL via Cloud SQL
  # ===========================================
  datasource:
    # A URL e o Driver são injetados automaticamente pelo starter do Spring Cloud GCP
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  # ===========================================
  # FILE UPLOAD CONFIGURATION
  # ===========================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # ===========================================
  # SPRING CLOUD GCP
  # ===========================================
  cloud:
    gcp:
      project-id: agrogame  # id do projeto de homolog/dev
      sql:
        database-name: ${DB_NAME}       # nome do seu banco
        instance-connection-name: agrogame:us-central1:agrogame-db-qa
      pubsub:
        enabled: true

# ===========================================
# SERVER CONFIGURATION
# ===========================================
server:
  port: ${PORT:8080}
  compression:
    enabled: true
    # Opcional: Você pode definir os mime-types aqui se quiser restringir a compressão
  tomcat:
    remoteip: # Corrigido: Movido para fora do bloco 'compression'
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always
    include-exception: true
# ===========================================
# LOGGING CONFIGURATION
# ===========================================
logging:
  level:
    root: INFO
    br.com.agrogame.agrogame: DEBUG
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# ===========================================
# JWT CONFIGURATION
# ===========================================
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 horas

# ===========================================
# ACTUATOR CONFIGURATION
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ===========================================
# APPLICATION CUSTOM PROPERTIES
# ===========================================
app:
  swagger:
    server-url: https://agrogame-api-dev-1017408486443.us-central1.run.app
    server-description: Development / QA
  pagination:
    default-page-size: 20
    max-page-size: 100
  points:
    max-transaction-per-day: 50

# === PROPRIEDADES DE INFRAESTRUTURA DA APLICAÇÃO ===
agrogame:
  pubsub:
    email-topic: dev-notifications-email
  storage:
    bucket-name: agrogame-uploads-dev
