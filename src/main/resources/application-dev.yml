# ===========================================
# PROFILE: DEVELOPMENT
# ===========================================

spring:
  application:
    name: agrogame-api

  # ===========================================
  # DATABASE CONFIGURATION - PostgreSQL via Cloud SQL
  # ===========================================
  datasource:
    url: jdbc:postgresql://${DB_NAME}?host=/cloudsql/${DB_HOST}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update   # Em dev, útil para atualizar schema automaticamente
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  # ===========================================
  # FILE UPLOAD CONFIGURATION
  # ===========================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# ===========================================
# LOGGING CONFIGURATION
# ===========================================
logging:
  level:
    root: DEBUG
    br.com.agrogame.agrogame: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: INFO
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# ===========================================
# JWT CONFIGURATION
# ===========================================
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 horas em milissegundos

# ===========================================
# ACTUATOR CONFIGURATION
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ===========================================
# APPLICATION CUSTOM PROPERTIES
# ===========================================
app:
  storage:
    base-path: /var/uploads
    cdn-url: http://localhost:8080/files

  pagination:
    default-page-size: 20
    max-page-size: 100

  points:
    max-transaction-per-day: 50
