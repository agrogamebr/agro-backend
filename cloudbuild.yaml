steps:
  # Step 1: Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/agrogame-repo/agro-backend:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/agrogame-repo/agro-backend:latest'
      - '.'

  # Step 2: Push para Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/agrogame-repo/agro-backend:$SHORT_SHA'

  # Step 3: Deploy para Cloud Run (Dev)
  - name: 'gcr.io/cloud-builders/run'
    args:
      - 'deploy'
      - 'agrogame-api-dev'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/agrogame-repo/agro-backend:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--service-account=bitbucket-deployer@$PROJECT_ID.iam.gserviceaccount.com'
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:agrogame-db-qa'
      - '--update-env-vars=SPRING_PROFILES_ACTIVE=dev,APP_ENV=dev,DB_USER=agrogame_db_qa_cloudrun,DB_NAME=postgres'
      - '--update-secrets=DB_PASS=db-password-qa:latest,JWT_SECRET=jwt-secret:latest'
      - '--allow-unauthenticated'
      - '--quiet'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/agrogame-repo/agro-backend:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/agrogame-repo/agro-backend:develop'

timeout: '3600s'

options:
  logging: CLOUD_LOGGING_ONLY
